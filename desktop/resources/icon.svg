<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="radar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plane-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- 雷达同心圆 -->
  <circle cx="128" cy="128" r="96" fill="url(#radar-glow)" stroke="#0284c7" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="128" cy="128" r="64" fill="none" stroke="#0284c7" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="4,4"/>
  <circle cx="128" cy="128" r="32" fill="none" stroke="#0284c7" stroke-width="2" stroke-opacity="0.6"/>

  <!-- 雷达十字线 -->
  <line x1="32" y1="128" x2="224" y2="128" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="128" y1="32" x2="128" y2="224" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- 航迹扫掠示意扇区 (半透明) -->
  <path d="M 128 128 L 210 80 A 96 96 0 0 0 128 32 Z" fill="#38bdf8" fill-opacity="0.15"/>

  <!-- 航空器造型 -->
  <g transform="translate(128, 128) scale(1.15)">
    <!-- 航迹高亮投影 -->
    <path d="M 0,-50 L 10,-22 L 46,6 L 46,16 L 10,9 L 10,32 L 23,45 L 23,49 L 0,42 L -23,49 L -23,45 L -10,32 L -10,9 L -46,16 L -46,6 L -10,-22 Z"
          fill="#0284c7" opacity="0.35" transform="translate(0, 3)"/>
    <!-- 飞机机身 -->
    <path d="M 0,-50 L 10,-22 L 46,6 L 46,16 L 10,9 L 10,32 L 23,45 L 23,49 L 0,42 L -23,49 L -23,45 L -10,32 L -10,9 L -46,16 L -46,6 L -10,-22 Z"
          fill="url(#plane-fill)"/>
  </g>

  <!-- 活跃状态指示绿点 -->
  <circle cx="204" cy="52" r="10" fill="#22c55e" stroke="#0f172a" stroke-width="3"/>
</svg>
